<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conference 1x1s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#17213A; --ink-2:#55627A; --ink-3:#8A94A8;
  --rule:#D6DCE6; --rule-2:#E7EBF1; --grid:#EEF1F5; --accent:#17213A; --accent-ink:#FFFFFF;
  --now:#D23B3B; --warn-bg:#FFF4D6; --warn-ink:#6B4E00; --focus:#2F6FED;
  --s1:#1F4E8C; --s2:#B8651B; --s3:#A8386C; --s4:#2E7D4F; --s5:#6B4C9A; --s6:#5B6B2E; --s0:#9AA3B5;
  --shadow:0 12px 32px rgba(23,33,58,.14);
  --label-w:190px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121722; --surface:#1A2130; --surface-2:#222B3C; --ink:#E7EBF3; --ink-2:#A9B3C6; --ink-3:#6F7A91;
    --rule:#2E3850; --rule-2:#273047; --grid:#1F2737; --accent:#E7EBF3; --accent-ink:#121722;
    --now:#FF6B6B; --warn-bg:#3A2F10; --warn-ink:#F3D27A; --focus:#7FA8FF;
    --s1:#5B8FD6; --s2:#E0924A; --s3:#DE78A9; --s4:#5FB381; --s5:#A98BD6; --s6:#9BB05A; --s0:#6F7A91;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121722; --surface:#1A2130; --surface-2:#222B3C; --ink:#E7EBF3; --ink-2:#A9B3C6; --ink-3:#6F7A91;
  --rule:#2E3850; --rule-2:#273047; --grid:#1F2737; --accent:#E7EBF3; --accent-ink:#121722;
  --now:#FF6B6B; --warn-bg:#3A2F10; --warn-ink:#F3D27A; --focus:#7FA8FF;
  --s1:#5B8FD6; --s2:#E0924A; --s3:#DE78A9; --s4:#5FB381; --s5:#A98BD6; --s6:#9BB05A; --s0:#6F7A91;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums;
  display:flex; flex-direction:column;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--surface);
  border-bottom:1px solid var(--rule); padding:10px 16px 0;
}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--ink-2);margin-left:8px;font-size:14px}
.days{display:flex;gap:2px;margin-top:6px}
.days button{
  background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 10px;font-size:15px;color:var(--ink-2);
}
.days button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:200px}
.chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);
  border-radius:999px;padding:5px 11px 5px 8px;font-size:14px;color:var(--ink-2)
}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-3))}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2);font-weight:500}
.search{flex:0 1 220px;min-width:140px;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:var(--surface)}
.pick{position:relative}
.pickbtn{border:1px solid var(--rule);border-radius:8px;padding:7px 28px 7px 10px;background:var(--surface);color:var(--ink-2);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.pickbtn::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-70%) rotate(45deg)}
.pickbtn.on{border-color:var(--ink);color:var(--ink);background:var(--surface-2);font-weight:500}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:15;min-width:240px;max-height:min(60vh,420px);overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.pop[hidden]{display:none}
.pop label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer;white-space:nowrap}
.pop label:hover{background:var(--surface-2)}
.pop label.all{font-weight:500;border-bottom:1px solid var(--rule-2);border-radius:6px 6px 0 0;margin-bottom:4px;padding-bottom:8px}
.pop label small{margin-left:auto;padding-left:14px;color:var(--ink-3);font-size:12px}
.pop label.zero{color:var(--ink-3)}
.pop input{accent-color:var(--ink);width:15px;height:15px;margin:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:500}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:500;white-space:nowrap}
.primary[disabled]{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:7px 12px;color:var(--ink)}
.banner{padding:8px 16px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink)}
.banner b{font-weight:600}
.note{padding:8px 16px;font-size:13px;color:var(--ink-2)}
main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

/* ---------- timeline ---------- */
.tl{position:relative;overflow:auto;flex:1 1 auto;background:var(--surface);border-bottom:1px solid var(--rule)}
.tl-inner{position:relative;display:grid;grid-template-columns:var(--label-w) 1fr;min-width:max-content;align-items:start}
.tl-head{display:contents}
.tl-head .corner{position:sticky;left:0;top:0;z-index:8;background:var(--surface);border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);height:34px}
.tl-head .axis{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--rule);height:34px}
.axis span{position:absolute;top:8px;margin-left:6px;font-size:13px;color:var(--ink-2)}
.row{display:contents}
.row .label{
  position:sticky;left:0;z-index:7;background:var(--surface);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule-2);
  padding:4px 12px;font-weight:500;font-size:14px;line-height:1.25;display:flex;flex-direction:column;justify-content:center;gap:2px;width:var(--label-w);overflow:hidden
}
.row .label span,.row .label small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .label small{font-weight:400;color:var(--ink-3);font-size:12px}
.row .lanes{position:relative;border-bottom:1px solid var(--rule-2);
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:var(--hour-w) 100%;
}
.bar{
  position:absolute;height:calc(var(--lane-h) - 6px);top:3px;border-radius:5px;background:var(--c,var(--s0));color:#fff;
  padding:4px 8px;font-size:13px;line-height:1.3;overflow:hidden;border:0;text-align:left;display:flex;flex-direction:column;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.bar .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar b{font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.2}
.bar .t{opacity:.85;font-size:12px}
.bar.multi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--c2)}
.bar.unmapped{background:repeating-linear-gradient(135deg,var(--s0),var(--s0) 6px,#B9C0CE 6px,#B9C0CE 12px);color:var(--ink)}
.bar:hover{filter:brightness(1.08)}
.nowline{position:absolute;top:34px;bottom:0;width:2px;margin-left:-1px;background:var(--now);z-index:6;pointer-events:none}
.nowline[hidden]{display:none}
.nowline span{position:absolute;top:0;left:50%;transform:translate(-50%,-100%);background:var(--now);color:#fff;font-size:11px;font-weight:600;line-height:1;padding:3px 6px;border-radius:4px;white-space:nowrap}
.dayhead{display:contents}
.dayhead .label{position:sticky;left:0;z-index:7;background:var(--surface-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0 12px;display:flex;align-items:center;font-weight:600;font-size:13px;color:var(--ink-2);width:var(--label-w)}
.dayhead .lanes{background:var(--surface-2);border-bottom:1px solid var(--rule);height:30px}
.listday{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.empty{padding:48px 16px;text-align:center;color:var(--ink-2)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--rule)}
.brand .build{font-size:11px;color:var(--ink-3)}
.brand img{height:22px;width:auto;display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand img{filter:brightness(0) invert(1);opacity:.85} }
:root[data-theme="dark"] .brand img{filter:brightness(0) invert(1);opacity:.85}
.empty h2{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 6px}

/* ---------- list ---------- */
.list{padding:8px 16px 24px;background:var(--surface);flex:1 1 auto;overflow:auto}
.slot{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.slot .time{font-weight:600;font-size:14px;padding-top:9px}
.slot .time small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}
.card:hover{background:var(--surface-2)}
.card .swatch{flex:0 0 5px;align-self:stretch;border-radius:3px;background:var(--c,var(--s0));margin-top:2px}
.card .who{font-weight:600}
.card .meta{color:var(--ink-2);font-size:14px}
.card .cov{color:var(--ink-3);font-size:13px}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;z-index:20;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;
  right:0;top:env(safe-area-inset-top,0px);bottom:0;width:min(420px,100%);transform:translateX(100%);transition:transform .22s ease;}
.sheet[data-open="true"]{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--rule)}
.sheet-head h2{margin:0;font-size:17px;line-height:1.3}
.sheet-head .x{background:none;border:0;font-size:22px;line-height:1;color:var(--ink-2);padding:0 2px}
.sheet-body{padding:12px 18px 20px;overflow:auto}
.sheet dl{margin:0;display:grid;grid-template-columns:136px 1fr;gap:10px 12px;font-size:14px}
.sheet dt{color:var(--ink-3)}
.sheet dd{margin:0;overflow-wrap:anywhere}
.sheet dd.strong{font-weight:600;color:var(--ink)}
.sheet a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sheet .call{margin-top:16px;padding:12px 14px;border-left:3px solid var(--now);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(10,14,24,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}

/* ---------- admin ---------- */
.admin{border-top:1px solid var(--rule);background:var(--bg);padding:14px 16px 20px}
.admin summary{cursor:pointer;font-weight:500;color:var(--ink-2)}
.admin .drop{margin-top:10px;border:1.5px dashed var(--rule);border-radius:10px;padding:18px;text-align:center;color:var(--ink-2);background:var(--surface)}
.admin .drop.over{border-color:var(--focus);color:var(--ink)}
.admin input[type=file]{display:none}
.admin .report{margin-top:10px;font-size:13px;white-space:pre-wrap;color:var(--ink-2);max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.admin .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.histhead{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 0 6px}
.ver{border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-bottom:6px}
.ver summary{display:flex;gap:10px;align-items:baseline;padding:8px 12px;cursor:pointer;font-size:14px;list-style:none}
.ver summary::-webkit-details-marker{display:none}
.ver .when{color:var(--ink-3);white-space:nowrap;font-size:13px;min-width:140px}
.ver .sum{flex:1}
.ver .tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.ver.cur summary .sum{font-weight:500}
.verbody{padding:0 12px 10px;border-top:1px solid var(--rule-2)}
.verbody pre{margin:8px 0 0;white-space:pre-wrap;font:13px/1.45 "IBM Plex Sans",sans-serif;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:720px){
  :root{--label-w:118px}
  h1 small{display:none}
  .controls{padding:8px 12px}
  .search{flex-basis:100%}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;max-height:86%;border-radius:14px 14px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .slot{grid-template-columns:70px 1fr;gap:6px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Conference meetings</h1>
    <nav class="days" id="days" aria-label="Day"></nav>
  </div>
</header>
<div class="controls">
  <div class="chips" id="chips" role="group" aria-label="Salesperson"></div>
  <input class="search" id="q" type="search" placeholder="Client, company or name" aria-label="Search client, company or attendee name">
  <div class="pick" id="clientPick">
    <button class="pickbtn" id="clientBtn" aria-haspopup="true" aria-expanded="false">All clients</button>
    <div class="pop" id="clientPop" hidden></div>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="vTimeline" aria-pressed="true">Timeline</button>
    <button id="vList" aria-pressed="false">List</button>
  </div>
  <button class="primary" id="addCal" hidden>Add to Outlook</button>
</div>
<div id="banner" hidden></div>

<script>
/* =========================== pure logic (shared with tests) =========================== */
const ALIASES = {
  date:["date","meeting date","day"],
  start:["start time","start","time","begin","from"],
  end:["end time","end","finish","to"],
  room:["room","location","rm","table"],
  company:["presenter firm","company","issuer","corporate","presenting company","presenter","management","mgmt"],
  ticker:["ticker","symbol"],
  companyAtt:["presenter attendee","presenter attendees","company attendees","mgmt attendees","management attendees","corporate attendees"],
  client:["client firm","client","firm","investor","investor firm","account","fund"],
  clientAtt:["client attendee(s)","client attendees","client attendee","attendee","attendees","investor attendees","investor attendee","contact","name"],
  clientEmail:["client email(s)","client email","client emails","email","emails","attendee email"],
  clientPhone:["client phone","phone","mobile","cell","attendee phone"],
  analyst:["cantor analyst (covers company)","cantor analyst","analyst","research analyst"],
  notes:["notes","note","comments","comment"],
  sales:["salesperson","sales","sales coverage","coverage","sales rep","rep"],
  salesEmail:["salesperson email","sales email","email"],
  salesMobile:["salesperson mobile","sales mobile","mobile","phone"],
  aliases:["also known as","aka","aliases","alias","other names"],
  role:["title / pod","title/pod","title","pod","role"],
  type:["meeting type","type"],
};
const norm = s => String(s ?? "").trim().toLowerCase().replace(/[\s_]+/g," ");
const normKey = s => norm(s).replace(/[^a-z0-9 ]/g,"").replace(/\b(llc|lp|inc|ltd|llp|co|corp|plc)\b/g,"").replace(/\s+/g," ").trim();
const pad2 = n => String(n).padStart(2,"0");

function mapHeaders(row){
  const hs = row.map(norm), found = {};
  for (const [field,names] of Object.entries(ALIASES)){
    for (const n of names){ const i = hs.indexOf(n); if (i>=0 && !Object.values(found).includes(i)){ found[field]=i; break; } }
  }
  return found;
}
function readTable(rows){
  const hi = rows.findIndex(r => r && r.some(c => c!==null && c!==undefined && c!==""));
  if (hi<0) return {cols:{},data:[],first:1};
  const cols = mapHeaders(rows[hi]); const data=[];
  for (let i=hi+1;i<rows.length;i++){
    const r = rows[i]; if (!r || !r.some(c => c!==null && c!==undefined && c!=="")) continue;
    const o={}; for (const [f,ci] of Object.entries(cols)) o[f]= r[ci] ?? null; o._row=i+1; data.push(o);
  }
  return {cols,data,first:hi+2};
}
function parseDate(v){
  if (v===null||v===undefined||v==="") return null;
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  if (typeof v==="number" && typeof XLSX!=="undefined"){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${pad2(d.m)}-${pad2(d.d)}`:null; }
  const s=String(v).trim().replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+/i,"");
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/); if (m){ let y=m[3]?+m[3]:new Date().getFullYear(); if(y<100)y+=2000; return `${y}-${pad2(m[1])}-${pad2(m[2])}`; }
  const months=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  m=s.toLowerCase().match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?/); if (m && months.includes(m[1])) { const y=m[3]?+m[3]:new Date().getFullYear(); return `${y}-${pad2(months.indexOf(m[1])+1)}-${pad2(m[2])}`; }
  m=s.toLowerCase().match(/^(\d{1,2})[- ]([a-z]{3})[a-z]*[- ](\d{2,4})/); if (m && months.includes(m[2])) { let y=+m[3]; if(y<100)y+=2000; return `${y}-${pad2(months.indexOf(m[2])+1)}-${pad2(m[1])}`; }
  const d=new Date(s); return isNaN(d)?null:`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function parseTime(v){
  if (v===null||v===undefined||v==="") return null;
  if (v instanceof Date && !isNaN(v)) return `${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
  if (typeof v==="number"){ const secs=Math.round(((v%1)+1)%1*86400); return `${pad2(Math.floor(secs/3600))}:${pad2(Math.floor(secs%3600/60))}`; }
  let s=String(v).trim().toLowerCase().split(/\s*[-–—]\s*|\s+to\s+/)[0].replace(/[.\s]/g,"");
  const m=s.match(/^(\d{1,2})(?::?(\d{2}))?(am|pm)?$/); if(!m) return null;
  let h=+m[1], mi=+(m[2]||0); const ap=m[3];
  if (ap==="pm"&&h!==12) h+=12; if (ap==="am"&&h===12) h=0; if (!ap&&h<7) h+=12;
  if (h>23||mi>59) return null; return `${pad2(h)}:${pad2(mi)}`;
}
const toMin = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const fromMin = n => `${pad2(Math.floor(n/60)%24)}:${pad2(n%60)}`;
function hashId(s){ let h1=0x811c9dc5,h2=0x01000193; for (let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; } return h1.toString(16).padStart(8,"0")+h2.toString(16).padStart(8,"0"); }

const DEFAULT_CONF = {name:"Conference", tz:"America/New_York", defaultLen:40, startOff:0, endOff:0, fuLen:0, style:"two", title:""};
const pageTitle = conf => conf.title || (conf.name.replace(/\s*conference\s*/i," ").trim()+" Meetings");

/** "A; \nB" / "A, B" -> ["A","B"] (unique, trimmed). keepCommas: only split on ; and line breaks (names carry ", Title") */
function splitPeople(v,keepCommas){
  const parts=String(v??"").split(keepCommas?/\s*;\s*|\r?\n/:/\s*[;,]\s*|\r?\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const seen=new Set(), out=[]; for (const x of parts){ const k=x.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(x); } } return out;
}
const fmtPresenters=v=>splitPeople(v,true).map(x=>{ const i=x.indexOf(","); return i<0?x:`${x.slice(0,i).trim()} (${x.slice(i+1).trim()})`; }).join(", ");
const joinNotes=(...xs)=>{ const seen=new Set(), out=[]; for (const x of xs.flatMap(v=>String(v??"").split(" | "))){ const t=x.replace(/\s+/g," ").trim(); if(t&&!seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); out.push(t); } } return out.join(" | "); };

/** RAW DATA tab (the per-client exports pasted one under another) -> unified rows */
function readRaw(rows){
  const hi=rows.findIndex(r=>r&&r.some(c=>norm(c)==="buyer firm")); if (hi<0) return null;
  const col={}; rows[hi].forEach((h,i)=>{ const k=norm(h); if(k&&!(k in col)) col[k]=i; });
  const g=(r,k)=>{ const i=col[k]; return i===undefined?null:(r[i]??null); };
  const out=[];
  for (let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.some(c=>c!==null&&c!==undefined&&String(c).trim()!=="")) continue;
    if (norm(g(r,"date"))==="date"||norm(g(r,"buyer firm"))==="buyer firm") continue; // a header row pasted along with the data
    const rowObj={_row:i+1,_tab:"Raw Data", date:g(r,"date")??g(r,"start time"), start:g(r,"start time"), end:g(r,"end time"), _startRaw:g(r,"start time"),
      company:splitPeople(g(r,"presenter firm"),true).join(" / "), companyAtt:splitPeople(g(r,"presenter attendee"),true).join("; "),
      clientParts:splitPeople(g(r,"buyer firm"),true).filter(x=>!/^cantor( fitzgerald.*)?$/i.test(x)), clientAtt:splitPeople(g(r,"buyer attendees")).join(", "),
      type:String(g(r,"meeting type")??"").trim(), event:String(g(r,"event")??"").trim(),
      notes:joinNotes(g(r,"details"),g(r,"topic: notes"),g(r,"extra notes")), sales:String(g(r,"salesperson override")??"").trim()};
    rowObj.client=rowObj.clientParts.join(" / "); out.push(rowObj);
  }
  return out;
}

/** Workbook (SheetJS) -> {conf, meetings, coverage, issues, warnings} */
function parseWorkbook(wb){
  const sheets={}; for (const n of wb.SheetNames) sheets[norm(n)]=n;
  const pick=(...names)=>{ for (const n of names) if (sheets[n]) return wb.Sheets[sheets[n]]; return null; };
  const wsR=pick("raw data","rawdata","raw","source data"), wsM=pick("meetings","1x1s","1x1","schedule","meeting schedule"), wsC=pick("coverage","sales coverage","clients","client coverage"), wsS=pick("settings","config");
  if ((!wsM&&!wsR)||!wsC) throw new Error("Need a Raw Data (or Meetings) tab and a Coverage tab.");
  const grid=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
  const conf={...DEFAULT_CONF};
  if (wsS){ for (const r of grid(wsS)){ if(!r||r[0]==null||r[1]==null||r[1]==="") continue; const k=norm(r[0]), v=r[1];
    if (k==="conference name") conf.name=String(v); else if (k==="timezone") conf.tz=String(v).trim();
    else if (k==="default meeting length (minutes)") conf.defaultLen=+v||40; else if (k==="start reminder (minutes before start)") conf.startOff=+v||0;
    else if (k==="end reminder (minutes before end)") conf.endOff=+v||0; else if (k==="follow-up block length (minutes)") conf.fuLen=Number.isFinite(+v)?Math.max(0,+v):0;
    else if (k==="reminder style") conf.style=(["call","end","two"].find(x=>norm(v).startsWith(x))||"two");
    else if (k==="page title") conf.title=String(v).trim(); } }
  try { new Intl.DateTimeFormat("en-US",{timeZone:conf.tz}); } catch { conf.tz=DEFAULT_CONF.tz; }
  const C=readTable(grid(wsC));
  const issues=[], warnings=[];
  if (!("client" in C.cols)||!("sales" in C.cols)) throw new Error("Coverage tab needs Client Firm and Salesperson columns.");
  const coverage=[];

    if (!wsM) throw new Error("The Raw Data tab is empty and there is no Meetings tab.");
    const M=readTable(grid(wsM)); source="Meetings";
    for (const f of ["date","start","company"]) if (!(f in M.cols)) throw new Error(`Meetings tab has no column for “${f}”. Rename the header or add an alias.`);
    if (!("client" in M.cols) && !("clientAtt" in M.cols)) throw new Error("Meetings tab needs a Client Firm or Client Attendees column.");
    rowsIn=M.data.map(m=>({_row:m._row,_tab:"Meetings",date:m.date,start:m.start,end:m.end,company:String(m.company??"").trim(),companyAtt:String(m.companyAtt??"").trim(),
      client:String(m.client??"").trim(),clientAtt:String(m.clientAtt??"").trim(),type:String(m.type??"").trim(),notes:String(m.notes??"").trim(),sales:String(m.sales??"").trim()}));

  meetings.sort((a,b)=>(a.date+a.start+a.client).localeCompare(b.date+b.start+b.client));

}

/** coverage key (firm or alias) -> rows; returns lookup(clientName) -> {rows, note} */

  const byAtt=att=>{ const txt=String(att||"").toLowerCase(); if(!txt.trim()) return {rows:[],firms:[]};
    const rows=coverage.filter(c=>c.contact && txt.includes(c.contact.toLowerCase())); return {rows, firms:[...new Set(rows.map(c=>c.client))]}; };
  return function(client, attendees){
    const mk=normKey(client);

    const cands=mk?Object.keys(map).filter(k => mk.startsWith(k+" ") || k.startsWith(mk+" ") || (k.length>=6 && mk.includes(k))).sort((a,b)=>b.length-a.length):[];

      if (teams.size===1) return {rows:map[cands[0]], note:`“${client}” matched coverage entry “${cands[0]}”`, firms:[map[cands[0]][0].client]};
      return {rows:[], note:`“${client}” matches several coverage entries (${cands.join(", ")}) – add it to “Also known as” on the right row`, firms:[]};
    }

/** is this Coverage contact one of the people in the attendee list? exact name, or same last name + first initial ("JAMES OCONNOR" ~ "Jim OConnor") */

/** who covers this meeting: the salespeople of the firm's contacts who are in the room; if none of them is named, everyone covering the firm.

/** attach sales coverage, colors, known contacts and combined notes */

  function renderChips(){
    const c=$("chips"); c.innerHTML="";
    const mk=(label,val,color)=>{ const b=document.createElement("button"); b.className="chip"; b.setAttribute("aria-pressed",String(val==="all"?state.sales==="all":(state.sales!=="all"&&state.sales.includes(val)))); if(color){ const d=document.createElement("span"); d.className="dot"; d.style.setProperty("--c",color); b.appendChild(d);} b.appendChild(document.createTextNode(label)); b.onclick=()=>{ // Everyone clears the selection; a name toggles on/off and several can be on at once
      if (val==="all") state.sales="all";
      else { const cur=state.sales==="all"?[]:state.sales.slice(); const i=cur.indexOf(val); if (i>=0) cur.splice(i,1); else cur.push(val);
        state.sales=cur.length?cur:"all"; } // kept in click order: the first salesperson picked is the main colour, later ones tag along
      pruneClients(); renderChips(); renderClientBtn(); if (!$("clientPop").hidden) renderClientPop(); renderView(); renderAddButton();}; return b; };
    c.appendChild(mk("Everyone","all",null));
    for (const p of (state.joined?.people||[])) c.appendChild(mk(p.name,p.name,p.color));
  }
  function renderAddButton(){
    const b=$("addCal"); const n=mySelection().length;
    b.hidden=!(caps.downloads && n);
    const firsts = state.sales==="all" ? [] : state.sales.map(n=>n.split(" ")[0]);
    const whose = !firsts.length ? "all" : `${firsts.length===1?firsts[0]:firsts.slice(0,-1).join(", ")+" & "+firsts[firsts.length-1]}’s`, day = state.day && state.day!=="all" ? weekdayName(state.day)+" " : "";
    const forWho = state.clients==="all" ? "" : ` for ${state.clients.length===1?state.clients[0]:state.clients.length+" clients"}`;
    b.textContent = `Add ${whose} ${n} ${state.q.trim()?"matching ":""}${day}meeting${n===1?"":"s"}${forWho} to Outlook`;
  }
  function empty(h,p){ $("main").innerHTML=`<div class="empty"><h2>${esc(h)}</h2><div>${esc(p)}</div></div>`; }
  function renderView(){
    $("vTimeline").setAttribute("aria-pressed",String(state.view==="timeline")); $("vList").setAttribute("aria-pressed",String(state.view==="list"));
    renderDays();
    if (!state.data){
      if (state.status==="loading") empty("Loading the schedule…","");
      else if (state.status==="nodb") empty("Sign in to see the schedule.","It’s shared with everyone who can open this page.");
      else if (state.status==="error") empty("The schedule isn’t available in this view.","");
      else if (state.status==="static-empty") empty("No schedule file found.","Upload the conference workbook as schedule.xlsx next to this page and reload.");
      else empty("No schedule loaded yet.", $("admin").hidden?"Check back once the conference grid has been uploaded.":"Upload the conference spreadsheet below to publish it to everyone.");
      return;
    }
    const ms=visibleMeetings();
    if (!ms.length){ empty("Nothing on this day for that filter.", state.q?"Try a different search.":""); return; }
    state.view==="timeline"?renderTimeline(ms):renderList(ms);
  }
  function laneAssign(items){ // greedy interval packing per row
    const lanes=[]; items.sort((a,b)=>toMin(a.start)-toMin(b.start));
    for (const it of items){ let l=lanes.findIndex(end=>end<=toMin(it.start)); if(l<0){l=lanes.length; lanes.push(0);} lanes[l]=toMin(it.end); it._lane=l; }
    return lanes.length;
  }
  function renderTimeline(ms){
    const conf=state.data.conf, now=nowInTz(conf.tz), mobile=window.matchMedia("(max-width:720px)").matches;
    const tl=document.createElement("div"); tl.className="tl";
    $("main").innerHTML=""; $("main").appendChild(tl);
    const labelW=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--label-w"))||184;
    const avail=tl.clientWidth-labelW-2;
    const days=[...new Set(ms.map(m=>m.date))].sort();
    // one time axis for all days shown, so the blocks line up
    let t0=Math.min(...ms.map(m=>toMin(m.start))), t1=Math.max(...ms.map(m=>toMin(m.end)));
    t0=Math.floor(t0/60)*60; t1=Math.ceil(t1/60)*60; if (t1-t0<180) t1=t0+180;
    const hours=(t1-t0)/60;
    // scale so company names fit inside their bars on two lines (sized for 9 in 10 names; the rest get an ellipsis); scroll sideways if needed
    const mc=document.createElement("canvas").getContext("2d"); mc.font='600 13px "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
    const needs=ms.map(m=>{ const dur=Math.max(toMin(m.end)-toMin(m.start),10); const words=m.company.split(" "), longest=Math.max(...words.map(w=>mc.measureText(w).width)); return (Math.max(mc.measureText(m.company).width*0.62,longest)+26)/dur*60; }).sort((a,b)=>a-b);
    const need=needs.length?needs[Math.min(needs.length-1,Math.floor(needs.length*0.9))]:0;
    const hourW=Math.min(440, Math.max(mobile?140:120, Math.floor(avail/hours), Math.ceil(need))), laneH=62, width=hours*hourW;
    const inner=document.createElement("div"); inner.className="tl-inner"; inner.style.setProperty("--hour-w",hourW+"px"); inner.style.setProperty("--lane-h",laneH+"px");
    const head=document.createElement("div"); head.className="tl-head";
    const corner=document.createElement("div"); corner.className="corner";
    const axis=document.createElement("div"); axis.className="axis"; axis.style.width=width+"px";
    for (let t=t0;t<t1;t+=60){ const sp=document.createElement("span"); sp.style.left=((t-t0)/60*hourW)+"px"; sp.textContent=fmtAxis(t); axis.appendChild(sp); }
    head.append(corner,axis); inner.appendChild(head);
    let scrollTo=null;
    for (const day of days){
      if (days.length>1 || state.day==="all"){ const dh=document.createElement("div"); dh.className="dayhead"; dh.innerHTML=`<div class="label" style="height:30px">${esc(dayLabel(day))}</div><div class="lanes" style="width:${width}px;height:30px"></div>`; inner.appendChild(dh); }
      // one row per client. Under the name: who covers it. With salespeople selected, only the selected ones are ever mentioned.
      const rows={};
      for (const m of ms) if (m.date===day) (rows[m.client] ??= {client:m.client,items:[]}).items.push({...m, sales:shownSales(m), _all:m});
      const rowKeys=Object.keys(rows).sort((a,b)=>a.localeCompare(b));
      for (const rk of rowKeys){
        const {client,items}=rows[rk]; const nl=laneAssign(items);
        const row=document.createElement("div"); row.className="row";
        const label=document.createElement("div"); label.className="label";
        const order=state.sales==="all"?(state.joined?.people||[]).map(p=>p.name):state.sales, cov=[...new Set(items.flatMap(m=>m.sales.map(p=>p.name)))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
        label.innerHTML=`<span>${esc(client)}</span><small>${cov.length?esc(cov.join(", ")):"no coverage"}</small>`;
        const lanes=document.createElement("div"); lanes.className="lanes"; lanes.style.height=(nl*laneH)+"px"; lanes.style.width=width+"px";
        label.style.height=(nl*laneH)+"px";
        for (const m of items){
          const b=document.createElement("button"); b.className="bar"+(m.sales.length>1?" multi":"")+(m.sales.length?"":" unmapped");
          b.style.left=((toMin(m.start)-t0)/60*hourW)+"px"; b.style.width=Math.max(((toMin(m.end)-toMin(m.start))/60*hourW)-3,28)+"px"; b.style.top=(m._lane*laneH+3)+"px";
          const sel = m.sales[0];
          if (sel) b.style.setProperty("--c",sel.color);
          if (m.sales.length>1){ const rest=m.sales.slice(1).map(p=>p.color); // the first-picked salesperson fills the bar; the others share the strip along the bottom
            b.style.setProperty("--c2", rest.length===1?rest[0]:`linear-gradient(90deg,${rest.map((c,i)=>`${c} ${i*100/rest.length}% ${(i+1)*100/rest.length}%`).join(",")})`); }
          b.innerHTML=`<b>${esc(m.company)}</b><span class="t">${esc(fmt12(m.start).replace(/ [AP]M/,""))}–${esc(fmt12(m.end).replace(/ [AP]M/,""))}</span>`;
          b.title=`${m.client} × ${m.company}, ${fmt12(m.start)}–${fmt12(m.end)}`+(m.sales.length>1?` (${m.sales.map(p=>p.name).join(", ")})`:"");
          b.onclick=()=>openSheet(m._all); lanes.appendChild(b);
        }
        row.append(label,lanes); inner.appendChild(row);
      }
    }
    tl.appendChild(inner);
    // current-time line: only on a single day's tab, and only while that day is today (conference time zone)
    clearInterval(nowTimer); nowTimer=null;
    if (state.day!=="all" && days.length===1){
      const line=document.createElement("div"); line.className="nowline"; line.innerHTML='<span></span>'; inner.appendChild(line);
      const place=()=>{ const n=nowInTz(conf.tz); const on = n.date===days[0] && n.min>=t0 && n.min<=t1;
        line.hidden=!on; if (!on) return null; const x=(n.min-t0)/60*hourW; line.style.left=(labelW+x)+"px";
        const h=Math.floor(n.min/60), mm=n.min%60; line.firstChild.textContent=`${((h+11)%12)+1}:${pad2(mm)} ${h>=12?"PM":"AM"}`; return x; };
      scrollTo=place();
      nowTimer=setInterval(()=>{ if (document.body.contains(line)) place(); else { clearInterval(nowTimer); nowTimer=null; } },30000);
    }
    if (scrollTo!==null) tl.scrollLeft=Math.max(0,scrollTo-tl.clientWidth/2);
  }
  function renderList(ms){
    const conf=state.data.conf, now=nowInTz(conf.tz);
    const slots={}; for (const m of ms) (slots[m.date+" "+m.start] ??= []).push(m);
    const list=document.createElement("div"); list.className="list"; let lastDay=null;
    for (const key of Object.keys(slots).sort()){
      const [day,start]=key.split(" ");
      if (state.day==="all" && day!==lastDay){ lastDay=day; const h=document.createElement("h2"); h.className="listday"; h.textContent=dayLabel(day); list.appendChild(h); }
      const slot=document.createElement("div"); slot.className="slot";
      const t=document.createElement("div"); t.className="time";
      const live = now.date===day && now.min>=toMin(start) && now.min<toMin(slots[key][0].end);
      t.innerHTML=`${esc(fmt12(start).replace(" ",""))}<small>${live?"now":"to "+esc(fmt12(slots[key][0].end).replace(" ",""))}</small>`;
      const col=document.createElement("div");
      for (const m of slots[key].sort((a,b)=>a.client.localeCompare(b.client))){
        const c=document.createElement("button"); c.className="card";
        const vis=shownSales(m), sel = vis[0];
        const sw=document.createElement("span"); sw.className="swatch"; if (sel) sw.style.setProperty("--c",sel.color);
        const txt=document.createElement("div");
        txt.innerHTML=`<div class="who">${esc(m.client)} <span style="font-weight:400;color:var(--ink-2)">meets</span> ${esc(m.company)}</div>`+
          `<div class="meta">${esc(m.clientAtt||"")}</div>`+
          `<div class="cov">${vis.length?esc(vis.map(p=>p.name).join(", ")):"no coverage"}</div>`;
        c.append(sw,txt); c.onclick=()=>openSheet(m); col.appendChild(c);
      }
      slot.append(t,col); list.appendChild(slot);
    }
    $("main").innerHTML=""; $("main").appendChild(list);
  }

  /* ----- detail sheet ----- */
  function openSheet(m){
    state.selected=m; const conf=state.data.conf;
    $("shTitle").textContent=`${m.client} × ${m.company}`;
    $("shSub").textContent="";
    const dl=[];
    const row=(k,v,html,strong)=>{ if(v) dl.push(`<dt>${esc(k)}</dt><dd${strong?' class="strong"':""}>${html||esc(v)}</dd>`); };
    row("Date", dayLabel(m.date), null, true);
    row("Time", `${fmt12(m.start)} – ${fmt12(m.end)}`, null, true);
    row("Meeting type", m.type);
    row("Client attendees", m.clientAtt);
    row("Company attendees", fmtPresenters(m.companyAtt));
    const v=viewOf(m);
    row("Coverage", v.sales.length?v.sales.map(p=>p.name).join(", "):"none mapped");
    row("Known contacts", v.known);
    row("Notes", v.notesAll||v.notes);
    $("shBody").innerHTML=`<dl>${dl.join("")}</dl>
      <div class="actions">${caps.downloads?`<button class="ghost" id="shIcs">Add this meeting to Outlook</button>`:""}</div>`;
    const b=$("shIcs"); if (b) b.onclick=()=>saveIcs([m], `${m.client} x ${m.company}`);
    $("sheet").dataset.open="true"; $("sheet").setAttribute("aria-hidden","false"); $("scrim").dataset.open="true"; $("shClose").focus();
  }
  function closeSheet(){ $("sheet").dataset.open="false"; $("sheet").setAttribute("aria-hidden","true"); $("scrim").dataset.open="false"; }
  $("shClose").onclick=closeSheet; $("scrim").onclick=closeSheet; document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

  /* ----- add to Outlook: one zip with two calendar files, named by the current filters ----- */
  function scopeLabel(){
    const who = state.sales==="all" ? "Everyone" : state.sales.length===1 ? state.sales[0] : state.sales.map(n=>n.split(" ")[0]).join(" + ");
    const when = state.day && state.day!=="all" ? weekdayName(state.day) : "All meetings";
    const q=state.q.trim();
    const cl = state.clients==="all" ? "" : ` - ${state.clients.length===1?state.clients[0]:state.clients.length+" clients"}`;
    return `${who} - ${when}${cl}`+(q?` - search ${q.slice(0,20)}`:"");
  }
  async function saveIcs(meetings,label){
    if (!caps.downloads) return;
    meetings=meetings.map(viewOf); // a salesperson's download only names the selected salespeople, their contacts and their notes
    const conf=state.data.conf, scope=label||scopeLabel(), style=conf.style||"two";
    // short names: Windows refuses to extract a zip when folder + file name get too long
    const base=(scope.length>48?scope.slice(0,48).trim():scope);
    const safe=t=>t.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_");
    const files=[];
    if (style!=="call") files.push({name:safe(`MEETINGS - ${base}`)+".ics", text:buildIcs(meetings,conf,`${base} - MEETINGS`,[style==="end"?"end":"meeting"])});
    if (style!=="end")  files.push({name:safe(`END OF MEETING NOTIFICATIONS - ${base}`)+".ics", text:buildIcs(meetings,conf,`${base} - END OF MEETING NOTIFICATIONS`,["call"])});
    try {
      await caps.downloads.save({filename:safe(base)+".zip", data:zipFiles(files)});
      toast(files.length>1 ? "Saved a zip with two calendar files: MEETINGS and END OF MEETING NOTIFICATIONS. Import both into Outlook." : "Saved a zip with the calendar file. Import it into Outlook.");
    } catch(e){ if (e?.code!=="declined") toast("Couldn’t save the calendar file in this view."); }
  }
  $("addCal").onclick=()=>saveIcs(mySelection());

  /* ----- controls ----- */
  $("q").oninput=e=>{state.q=e.target.value; renderView(); renderAddButton();};
  let rsT; window.addEventListener("resize",()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(state.view==="timeline"&&state.data) renderView(); },150); });
  $("vTimeline").onclick=()=>{state.view="timeline"; renderView();}; $("vList").onclick=()=>{state.view="list"; renderView();};

  /* ----- admin upload ----- */
  const drop=$("drop"), fileIn=$("file");
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
  fileIn.onchange=()=>{ if(fileIn.files[0]) handleFile(fileIn.files[0]); fileIn.value=""; };
  async function handleFile(f){
    const rep=$("report"); rep.hidden=false; rep.textContent="Reading "+f.name+"…"; $("publish").disabled=true; state.pending=null;
    try {
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:false});
      const data=parseWorkbook(wb);
      const people=[...new Set(data.coverage.map(c=>c.sales))];
      const days=[...new Set(data.meetings.map(m=>m.date))].sort();
      const lines=[`UPLOADED: ${f.name}`, `${data.meetings.length} meetings · ${days.map(dayLabel).join(", ")||"no days"} · ${people.join(", ")}`, ""];
      lines.push("Issues"); lines.push(...(data.issues.length?data.issues.map(s=>"  • "+s):["  none"]), "");
      lines.push("Warnings"); lines.push(...(data.warnings.length?data.warnings.map(s=>"  • "+s):["  none"]));
      const diff=diffSchedules(state.live,data); state.pendingDiff=diff;
      rep.textContent=lines.join("\n");
      state.pending=data; $("publish").disabled=!(caps.db && data.meetings.length && (diff.count||!state.live));
      $("pubnote").textContent = !caps.db ? "Sign in to publish." : (diff.count||!state.live) ? "Replaces the live schedule for everyone." : "Nothing to publish – this file matches the live schedule.";
      state.status="ready"; setData(data,{preview:true}); // preview locally right away
    } catch(err){ rep.textContent="Couldn’t read that file: "+(err.message||err); }
  }
  async function exportXlsx(){
    if (!state.data||!caps.downloads) { toast(caps.downloads?"Nothing to export yet.":"Downloads aren’t available in this view."); return; }
    try { await caps.downloads.save({filename:`${pageTitle(state.data.conf).replace(/[^\w\- ]+/g,"").replace(/\s+/g,"_")}_schedule.xlsx`, data:buildWorkbook(state.data)}); toast("Saved. Edit it, then drop it back here and publish."); }
    catch(e){ if (e?.code!=="declined") toast("Couldn’t save the file in this view."); }
  }
  $("exportXlsx").onclick=exportXlsx;
  const snapshotOf=d=>{ const atts=[], ix=new Map();
    const meetings=d.meetings.map(m=>{ const {companyAtt,_sales,...rest}=m; const k=companyAtt||""; if(!ix.has(k)){ ix.set(k,atts.length); atts.push(k); } return {...rest, ca:ix.get(k)}; });
    return {conf:d.conf, meetings, atts, coverage:d.coverage, issues:(d.issues||[]).slice(0,60), warnings:(d.warnings||[]).slice(0,60)}; };
  const unpack=d=>({conf:{...DEFAULT_CONF,...(d.conf||{})}, meetings:(d.meetings||[]).map(m=>{ const {ca,...rest}=m; return {...rest, companyAtt: rest.companyAtt ?? (d.atts?.[ca] ?? "")}; }), coverage:d.coverage||[], issues:d.issues||[], warnings:d.warnings||[]});
  async function publishSchedule(d, label){
    const diff=diffSchedules(state.live,d);
    const id="v"+new Date().toISOString().replace(/[-:.TZ]/g,"").slice(0,14)+"-"+Math.random().toString(36).slice(2,6);
    const summary=label?`${label} (${describeChanges(diff,true)})`:`${state.live?"Update":"Initial upload"}: ${describeChanges(diff,true)}`;
    const version={id, createdAt:new Date().toISOString(), summary, changes:describeChanges(diff).slice(0,150), count:diff.count, meetings:d.meetings.length, data:snapshotOf(d)};
    await caps.db.doc("versions/"+id).set(version);
    await caps.db.doc("data/schedule").set({...snapshotOf(d), sample:false, versionId:id, updatedAt:version.createdAt});
    return version;
  }
  $("publish").onclick=async()=>{
    if (!state.pending||!caps.db) return;
    const d=state.pending; $("publish").disabled=true; $("pubnote").textContent="Publishing…";
    try { await publishSchedule(d); $("pubnote").textContent="Published."; toast("Published – everyone sees it now."); state.pending=null; loadHistory(); }
    catch(e){ $("pubnote").textContent="Publish failed: "+(e.message||e.code||e); $("publish").disabled=false; }
  };
  /* ----- history ----- */
  let histUnsub=null;
  function loadHistory(){
    if (!caps.db||histUnsub) return;
    histUnsub=caps.db.collection("versions").orderBy("createdAt","desc").limit(30).onSnapshot(snap=>{ state.versions=snap.docs.map(x=>x.data()); renderHistory(); }, ()=>{ histUnsub=null; });
  }
  function renderHistory(){
    const h=$("history"); const cur=state.live?.versionId;
    if (!state.versions.length){ h.innerHTML=`<div style="font-size:13px;color:var(--ink-3)">No uploads yet. Each upload you publish is listed here.</div>`; return; }
    h.innerHTML="";
    state.versions.forEach((v,i)=>{
      const det=document.createElement("details"); det.className="ver"+(v.id===cur?" cur":"");
      const when=new Date(v.createdAt).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
      det.innerHTML=`<summary><span class="when">${esc(when)}</span><span class="sum">${esc(v.summary)}</span>${v.id===cur?'<span class="tag">live</span>':""}</summary>
        <div class="verbody"><pre>${esc((v.changes||[]).join("\n")||"No changes recorded.")}</pre>
        <div class="row2">${v.id===cur?(i+1<state.versions.length?`<button class="ghost" data-undo="${esc(state.versions[i+1].id)}">Undo this change</button>`:""):`<button class="ghost" data-restore="${esc(v.id)}">Restore this version</button>`}</div></div>`;
      h.appendChild(det);
    });
    h.querySelectorAll("[data-restore],[data-undo]").forEach(b=>b.onclick=()=>restoreVersion(b.dataset.restore||b.dataset.undo, !!b.dataset.undo));
  }
  async function restoreVersion(id,isUndo){
    const v=state.versions.find(x=>x.id===id); if(!v||!caps.db) return;
    const when=new Date(v.createdAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    if (!confirm(`${isUndo?"Undo the latest change and go back":"Restore"} to the version from ${when}? Everyone will see it.`)) return;
    try { await publishSchedule(unpack(v.data), isUndo?"Undo":`Restored ${when}`); toast(isUndo?"Undone.":"Restored."); }
    catch(e){ toast("Couldn’t restore: "+(e.message||e.code||e)); }
  }
  $("admin").addEventListener("toggle",()=>{ if($("admin").open) loadHistory(); });

  /* ----- misc ----- */
  function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  let toastT; function toast(msg){ let t=document.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),6000); }

  /* ----- static hosting (GitHub Pages etc.): no claude runtime -> read schedule.xlsx that sits next to this page ----- */
  async function connectStatic(){
    caps.downloads={ save: async ({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".ics")?"text/calendar":filename.endsWith(".zip")?"application/zip":"application/octet-stream"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000); return {status:"saved"}; } };
    if (location.protocol!=="file:") for (const name of ["schedule.xlsx","conference_1x1.xlsx"]){
      try { const r=await fetch(name+"?v="+Date.now(),{cache:"no-store"}); if(!r.ok) continue;
        const data=parseWorkbook(XLSX.read(await r.arrayBuffer(),{type:"array",cellDates:false})); state.status="ready"; setData(data,{}); return; }
      catch(e){ /* try the next name */ }
    }
    state.status="static-empty"; renderView();
  }
  renderView();
  if (window.claude && typeof claude.use==="function") connect(); else connectStatic();
})();
</script>
</body>
